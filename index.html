<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Desk | 個人法務與實戰知識儀表板</title>
    <style>
        :root {
            --bg-base: #f4f6f9;
            --surface: #ffffff;
            --navy-primary: #1e293b;
            --navy-accent: #0f172a;
            --brand-blue: #2563eb;
            --brand-light: #eff6ff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --tag-yellow: #fef08a;
            --tag-yellow-text: #854d0e;
            --tag-purple: #f3e8ff;
            --tag-purple-text: #6b21a8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang TC", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px;
        }

        /* 頂部 Header */
        header {
            max-width: 1300px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--navy-primary);
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-status {
            font-size: 13px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Dashboard 格狀佈局 */
        .dashboard-grid {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1.3fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* 卡片共用樣式 */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表單元件 */
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            background: #fafbfc;
            margin-bottom: 10px;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            border-color: var(--brand-blue);
            background: #fff;
        }

        .btn {
            background: var(--navy-primary);
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--navy-accent); }

        .btn-secondary {
            background: var(--brand-light);
            color: var(--brand-blue);
            border: 1px solid #bfdbfe;
        }

        .btn-secondary:hover { background: #dbeafe; }

        /* 工作日誌清單 */
        .log-item {
            border-left: 3px solid var(--brand-blue);
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
            position: relative;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .log-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .tag-discussion { background: var(--tag-yellow); color: var(--tag-yellow-text); }
        .tag-project { background: var(--tag-purple); color: var(--tag-purple-text); }
        .tag-general { background: #e2e8f0; color: #475569; }

        .log-date { font-size: 12px; color: var(--text-muted); }
        .log-content { font-size: 13px; color: var(--text-main); white-space: pre-wrap; }

        .log-del {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }
        .log-del:hover { color: #ef4444; }

        /* 法學英文卡片 */
        .vocab-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .vocab-word { font-size: 20px; font-weight: 800; color: #93c5fd; }
        .vocab-pronounce { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .vocab-meaning { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
        .vocab-clause {
            font-size: 12px;
            background: rgba(255,255,255,0.08);
            padding: 10px;
            border-radius: 6px;
            border-left: 2px solid #38bdf8;
            color: #e2e8f0;
            font-style: italic;
        }

        /* 專案與重點排程清單 */
        .project-item {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-item h4 { font-size: 13px; font-weight: 700; }
        .project-item p { font-size: 12px; color: var(--text-muted); }

        .delete-btn-sm {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn-sm:hover { color: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>⚖️ Legal Ops & Insights</h1>
            <p>聚焦高價值案件思考・法學實務探討・每日英文進修</p>
        </div>
        <div class="header-status" id="current-date-badge"></div>
    </header>

    <div class="dashboard-grid">
        
        <!-- 左側：重點工作紀錄與 Issue 探討庫 -->
        <div class="col-main">
            
            <!-- 重點紀錄輸入區 -->
            <div class="card">
                <div class="card-header">
                    <h2>📝 記錄今日重點 / 值得深究的 Issue</h2>
                </div>
                <div style="display: flex; gap: 10px;">
                    <select id="log-category" style="width: 140px;">
                        <option value="discussion">💡 值得討論的 Issue</option>
                        <option value="project">🚀 重點專案進展</option>
                        <option value="general">📌 關鍵工作摘要</option>
                    </select>
                    <input type="text" id="log-title" placeholder="輸入主題（例：競業禁止補償金實務見解、跨國採購管轄權爭議）">
                </div>
                <textarea id="log-detail" rows="3" placeholder="簡短記下關鍵細節、主管/律師的建議，或是日後回顧時值得參考的論點..."></textarea>
                <button class="btn" onclick="addDailyLog()">儲存紀錄</button>
            </div>

            <!-- 歷史重點資料庫 -->
            <div class="card">
                <div class="card-header">
                    <h2>📚 實戰經驗與 Issue 紀錄</h2>
                    <input type="text" id="search-input" placeholder="🔍 搜尋過往紀錄關鍵字..." style="width: 200px; margin-bottom: 0;" oninput="renderLogs()">
                </div>
                <div id="logs-container"></div>
            </div>

        </div>

        <!-- 右側：每日法學英文與重點專案 Milestone -->
        <div class="col-sub">
            
            <!-- 每日法學英文 Pocket -->
            <div class="card">
                <div class="card-header">
                    <h2>📖 每日法學英文 (Daily Legal English)</h2>
                    <button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="nextVocab()">換下一個 ↻</button>
                </div>
                <div class="vocab-box" id="vocab-display">
                    <!-- 動態載入單字 -->
                </div>
                <div style="font-size: 12px; color: var(--text-muted); text-align: center;">
                    每天花 1 分鐘熟悉一個合約核心詞彙與實戰條款。
                </div>
            </div>

            <!-- 當前核心專案追蹤 (Key Milestones) -->
            <div class="card">
                <div class="card-header">
                    <h2>🎯 當前核心專案 / 重大事件</h2>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" id="proj-title" placeholder="專案名稱或庭期" style="margin-bottom:0;">
                    <input type="date" id="proj-date" style="width: 140px; margin-bottom:0;">
                    <button class="btn" onclick="addProject()">新增</button>
                </div>
                <div id="projects-container"></div>
            </div>

            <!-- 法務快捷查詢傳送門 -->
            <div class="card">
                <div class="card-header">
                    <h2>🔗 常用實務檢索傳送門</h2>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <a href="https://law.moj.gov.tw/" target="_blank" style="text-decoration: none;">
                        <button class="btn-secondary" style="width:100%; text-align:left; font-size: 12px;">📜 全國法規資料庫</button>
                    </a>
                    <a href="https://judgment.judicial.gov.tw/FJUD/default.aspx" target="_blank" style="text-decoration: none;">
                        <button class="btn-secondary" style="width:100%; text-align:left; font-size: 12px;">⚖️ 裁判書檢索系統</button>
                    </a>
                    <a href="https://www.lawplus.com.tw/" target="_blank" style="text-decoration: none;">
                        <button class="btn-secondary" style="width:100%; text-align:left; font-size: 12px;">🔍 法源法律網</button>
                    </a>
                    <a href="https://www.translegal.com/" target="_blank" style="text-decoration: none;">
                        <button class="btn-secondary" style="width:100%; text-align:left; font-size: 12px;">🌐 TransLegal 詞庫</button>
                    </a>
                </div>
            </div>

        </div>

    </div>

<script>
    // 預載合約法學英文詞庫（精選高頻實務詞彙）
    const legalVocabList = [
        {
            word: "Indemnification",
            pronounce: "[ɪnˌdɛmnəfɪˈkeɪʃən] (n.) 補償、損害免責",
            meaning: "一方承諾若因特定事由使他方遭受第三方索賠或損害時，給予金錢補償與法律防護。",
            clause: "Seller shall indemnify, defend, and hold harmless Buyer from and against any third-party claims arising out of IP infringement."
        },
        {
            word: "Liquidated Damages",
            pronounce: "[ˈlɪkwɪdeɪtɪd ˈdæmɪdʒɪz] (n.) 預定違約金",
            meaning: "締約雙方預先約定當違約發生時應支付的損害賠償總額，避免日後舉證損害之爭議。",
            clause: "The parties agree that liquidated damages shall reflect a reasonable pre-estimate of likely loss, not a penalty."
        },
        {
            word: "Severability",
            pronounce: "[ˌsɛvərəˈbɪlɪti] (n.) 可分割條款",
            meaning: "若合約某條款被法院認定無效，不影響其他條款的有效性與拘束力。",
            clause: "If any provision of this Agreement is held to be invalid or unenforceable, the remaining provisions shall continue in full force."
        },
        {
            word: "Force Majeure",
            pronounce: "[ˌfɔːrs məˈʒɜːr] (n.) 不可抗力",
            meaning: "無法預見、無法避免且無法克服的客觀情況（如天災、戰爭、政府禁令）導致免責。",
            clause: "Neither party shall be liable for delay or failure to perform its obligations caused by events of Force Majeure beyond reasonable control."
        },
        {
            word: "Representations and Warranties",
            pronounce: "(n.) 聲明與保證 (R&W)",
            meaning: "一方對事實現狀的真實陳述（Rep），以及對未來事實或履行能力之承諾擔保（Warranty）。",
            clause: "Supplier represents and warrants that the Deliverables do not infringe upon any third-party proprietary rights."
        }
    ];

    let currentVocabIndex = 0;

    // 本地持久化資料模型
    let legalData = JSON.parse(localStorage.getItem('my_legal_dashboard')) || {
        logs: [
            {
                id: 1,
                date: "2026/11/02",
                category: "discussion",
                title: "高階經理人合約競業禁止條款之合理補償爭議",
                detail: "實務上常有業務主管離職案件。今日審約時確認：補償金額若未達離職前月平均薪資50%，可能被法院判定無效，後續擬範本時應加入階梯式補償標準。"
            }
        ],
        projects: [
            { id: 1, title: "2026 年度制式合約大改版", date: "2026-11-30" },
            { id: 2, title: "外部採購主合約 (Master Agreement) 協商", date: "2026-12-15" }
        ]
    };

    function saveState() {
        localStorage.setItem('my_legal_dashboard', JSON.stringify(legalData));
    }

    // 初始化日期標籤
    document.getElementById('current-date-badge').innerText = new Date().toLocaleDateString('zh-TW', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    });

    // 渲染法學英文單字
    function renderVocab() {
        const item = legalVocabList[currentVocabIndex];
        document.getElementById('vocab-display').innerHTML = `
            <div class="vocab-word">${item.word}</div>
            <div class="vocab-pronounce">${item.pronounce}</div>
            <div class="vocab-meaning">${item.meaning}</div>
            <div class="vocab-clause">${item.clause}</div>
        `;
    }

    function nextVocab() {
        currentVocabIndex = (currentVocabIndex + 1) % legalVocabList.length;
        renderVocab();
    }

    // 新增工作日誌
    function addDailyLog() {
        const title = document.getElementById('log-title').value.trim();
        const detail = document.getElementById('log-detail').value.trim();
        const category = document.getElementById('log-category').value;

        if (!title) return alert("請輸入主題或案件名稱");

        const newLog = {
            id: Date.now(),
            date: new Date().toLocaleDateString('zh-TW'),
            category,
            title,
            detail
        };

        legalData.logs.unshift(newLog);
        saveState();
        document.getElementById('log-title').value = '';
        document.getElementById('log-detail').value = '';
        renderLogs();
    }

    function deleteLog(id) {
        if (!confirm("確定要移除這筆紀錄嗎？")) return;
        legalData.logs = legalData.logs.filter(item => item.id !== id);
        saveState();
        renderLogs();
    }

    function renderLogs() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const container = document.getElementById('logs-container');
        
        const filtered = legalData.logs.filter(l => 
            l.title.toLowerCase().includes(query) || l.detail.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 13px;">尚無相關紀錄</div>`;
            return;
        }

        container.innerHTML = filtered.map(log => {
            let tagClass = 'tag-general';
            let tagText = '關鍵工作';
            if (log.category === 'discussion') { tagClass = 'tag-discussion'; tagText = 'Issue 探討'; }
            else if (log.category === 'project') { tagClass = 'tag-project'; tagText = '專案進展'; }

            return `
                <div class="log-item">
                    <button class="log-del" onclick="deleteLog(${log.id})" title="刪除">✕</button>
                    <div class="log-header">
                        <span class="log-tag ${tagClass}">${tagText}</span>
                        <span class="log-date">${log.date}</span>
                    </div>
                    <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--navy-primary);">${log.title}</div>
                    <div class="log-content">${log.detail}</div>
                </div>
            `;
        }).join('');
    }

    // 新增專案排程
    function addProject() {
        const title = document.getElementById('proj-title').value.trim();
        const date = document.getElementById('proj-date').value;

        if (!title) return alert("請輸入專案名稱");

        legalData.projects.push({ id: Date.now(), title, date: date || "未排定" });
        saveState();
        document.getElementById('proj-title').value = '';
        document.getElementById('proj-date').value = '';
        renderProjects();
    }

    function deleteProject(id) {
        legalData.projects = legalData.projects.filter(p => p.id !== id);
        saveState();
        renderProjects();
    }

    function renderProjects() {
        const container = document.getElementById('projects-container');
        if (legalData.projects.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 10px; color: var(--text-muted); font-size: 12px;">無列管中的專案</div>`;
            return;
        }

        container.innerHTML = legalData.projects.map(p => `
            <div class="project-item">
                <div>
                    <h4>${p.title}</h4>
                    <p>🎯 目標日：${p.date}</p>
                </div>
                <button class="delete-btn-sm" onclick="deleteProject(${p.id})">✕</button>
            </div>
        `).join('');
    }

    // 啟動加載
    renderVocab();
    renderLogs();
    renderProjects();
</script>
</body>
</html>
